name: OmniCore Worker validation

on:
  push:
    branches: [cloudflare-adaptation]
    paths:
      - "workers/**"
      - ".github/workflows/omnicore-worker.yml"
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "workers/**"
      - ".github/workflows/omnicore-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests-and-dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run Worker authentication, fallback and rate-limit tests
        run: node --experimental-strip-types --test src/index.test.ts
      - name: Validate Wrangler configuration and build bundle (no deployment)
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler/deploy
