name: OmniCore Worker validation

on:
  push:
    branches: [cloudflare-adaptation]
    paths:
      - "workers/**"
      - ".github/workflows/omnicore-worker.yml"
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "workers/**"
      - ".github/workflows/omnicore-worker.yml"
  workflow_dispatch:

concurrency:
  group: omnicore-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  worker-tests-and-dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run Worker authentication, fallback and rate-limit tests
        run: node --experimental-strip-types --test src/index.test.ts
      - name: Install ephemeral Workers Vitest integration dependencies
        run: npm install --no-save --no-package-lock
      - name: Run Worker integration tests against local Miniflare D1
        run: npx vitest run --config vitest.config.ts
      - name: Validate D1 migrations against SQLite
        run: |
          python3 - <<'PY'
          import pathlib
          import sqlite3

          db = sqlite3.connect(":memory:")
          migrations = sorted(pathlib.Path("migrations").glob("*.sql"))
          assert len(migrations) >= 5, "Expected all D1 migrations"
          for migration in migrations:
              if migration.name == "0005_api_key_expiry.sql":
                  db.execute("INSERT INTO api_keys (id, key_hash, name, created_at) VALUES (?, ?, ?, ?)", ("legacy", "legacy-hash", "legacy key", "2026-01-01T00:00:00.000Z"))
              db.executescript(migration.read_text(encoding="utf-8"))
              print(f"Applied {migration.name}")

          legacy_expiry = db.execute("SELECT expires_at FROM api_keys WHERE id = ?", ("legacy",)).fetchone()[0]
          assert legacy_expiry == "2026-04-01T00:00:00.000Z", f"Legacy key expiry backfill incorrect: {legacy_expiry}"
          print("Legacy managed-key expiry backfill validation passed")

          required = {
              "api_keys": {"id", "key_hash", "name", "created_at", "revoked_at", "expires_at"},
              "rate_limit_windows": {"key_hash", "window_start", "request_count"},
              "provider_circuits": {"provider", "failure_count", "opened_until"},
              "usage_events": {"id", "provider", "model", "status", "created_at", "api_key_id"},
          }
          for table, expected in required.items():
              columns = {row[1] for row in db.execute(f"PRAGMA table_info({table})")}
              missing = expected - columns
              assert not missing, f"{table} missing columns: {sorted(missing)}"
          print("D1 migration schema validation passed")
          PY
      - name: Validate Wrangler configuration and build bundle (no deployment)
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler/deploy
