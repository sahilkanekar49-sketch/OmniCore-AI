name = "omnicore-ai-gateway"
main = "src/index.ts"
compatibility_date = "2026-11-07"
workers_dev = true

[vars]
FALLBACK_ORDER = "workers-ai,openai,gemini"
DEFAULT_MODEL = "gpt-4o-mini"

[[d1_databases]]
binding = "DB"
database_name = "omnicore-ai"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[ai]
binding = "WORKERS_AI"
[triggers]
crons = ["17 * * * *"]
